[package]
name = "cubipal-desktop"
version = "0.1.0"
description = "CubiPal Desktop Companion App"
authors = ["CubiPal"]
edition = "2024"

[lib]
name = "cubipal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
keyring = "3"
mdns-sd = "0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
