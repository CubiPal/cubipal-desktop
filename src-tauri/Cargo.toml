[package]
name = "cubipal-desktop"
version = "0.2.0"
description = "CubiPal Desktop Companion App"
authors = ["CubiPal"]
edition = "2024"

[lib]
name = "cubipal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "net", "io-util", "macros"] }
# Without platform features keyring v3 silently uses an in-memory mock store,
# so nothing survives a restart. Each feature only builds on its own OS.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
mdns-sd = "0.13"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
open = "5"
semver = "1"
chrono-tz = "0.10"
rrule = "0.14"
tauri-plugin-autostart = "2"
# A second launch (e.g. clicking the app launcher again) focuses the running
# app instead of starting another, invisible, copy.
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree via keyring; used to ask the session bus whether a
# system-tray host is running (ChromeOS and stock GNOME have none).
dbus = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
