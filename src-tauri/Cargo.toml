[package]
name = "cubipal-desktop"
version = "0.1.0"
description = "CubiPal Desktop Companion App"
authors = ["CubiPal"]
edition = "2024"

[lib]
name = "cubipal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread", "net", "io-util", "macros"] }
keyring = "3"
mdns-sd = "0.13"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
open = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
