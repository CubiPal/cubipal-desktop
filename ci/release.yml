name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
          - platform: "macos-13"
            target: "x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Package Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CubiPal Companion ${{ github.ref_name }}"
          releaseBody: |
            ### CubiPal Desktop Companion ${{ github.ref_name }}
            
            Desk companion tray app for meeting countdowns and focus timers over local Wi-Fi.
            
            #### Downloads
            - **Windows (x64):** Download `.msi` or `.exe` installer below.
            - **macOS (Apple Silicon & Intel):** Download `.dmg` installer below.
            
            *Note: Binaries in v1 are unsigned. Follow the included instructions to bypass standard OS warnings on first run.*
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
