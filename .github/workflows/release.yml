name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      test_tag:
        description: "Release tag (e.g. v0.2.0-test)"
        required: false
        default: ""

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag_name: ${{ steps.get-tag.outputs.tag }}
    steps:
      - name: Determine tag name
        id: get-tag
        # Inputs reach the script as environment variables, never pasted into
        # it, and the tag is validated before use (B-10).
        env:
          EVENT_NAME: ${{ github.event_name }}
          TEST_TAG: ${{ github.event.inputs.test_tag }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$TEST_TAG"
            if [ -z "$TAG" ]; then
              TAG="v0.2.0-test.$RUN_NUMBER"
            fi
          else
            TAG="$REF_NAME"
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: must look like v1.2.3 or v1.2.3-test.4"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create-release
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.get-tag.outputs.tag }}
        with:
          script: |
            const tag = process.env.TAG;
            const isPush = context.eventName === 'push';
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `CubiPal Companion ${tag}`,
              body: `### CubiPal Desktop Companion ${tag}\n\nDesk companion tray app for meeting countdowns and focus timers over local Wi-Fi.\n\n#### Downloads\n- **Windows:** Download \`.msi\` or \`.exe\` installer below.\n- **macOS:** Download \`.dmg\` installer below.\n- **Linux (x64):** Download \`.AppImage\` (any distro), \`.deb\` (Ubuntu/Debian) or \`.rpm\` (Fedora) below.\n\n*Note: the installers are not code-signed by Apple or Microsoft yet, so Windows and macOS warn on first launch; see docs/building-and-releasing.md. In-app updates are signed with the Tauri updater key. Pal firmware is published separately at https://cubipal.com/firmware/latest.json.*`,
              draft: true,
              prerelease: !isPush
            });
            return release.data.id;

  build-release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
          - platform: "windows-latest"
            target: "aarch64-pc-windows-msvc"
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
          # 22.04, not latest: an AppImage only runs on distros whose glibc is
          # at least as new as the one it was built against.
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Package Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read at compile time with option_env!. All optional: without
          # MICROSOFT_CLIENT_ID the app shows Outlook as "coming soon".
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

  publish-release:
    needs: [create-release, build-release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish Release (if tag push)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TAG: ${{ needs.create-release.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [[ "$REF" =~ ^refs/tags/v ]]; then
            echo "Publishing release $TAG..."
            gh release edit "$TAG" --draft=false --repo "$REPO"
          else
            echo "Workflow run was triggered manually. Leaving release as draft for inspection."
          fi
